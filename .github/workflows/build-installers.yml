name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install application and packaging dependencies
        run: python -m pip install ".[installer]"
      - name: Prepare application icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python -c "from PIL import Image; Image.open('qr_code_generator/assets/qr_gen_icon.png').save('build/qr_gen_icon.ico', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])"
      - name: Build application
        shell: pwsh
        run: |
          $iconPath = (Resolve-Path "build/qr_gen_icon.ico").Path
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "QR Code Generator" `
            --icon $iconPath `
            --specpath build `
            --workpath build/pyinstaller `
            --distpath dist `
            "Launch QR Generator.pyw"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($compiler) {
            & $compiler.Source installer/windows/qr-code-generator.iss
          } else {
            $compilerPath = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $compilerPath)) {
              throw "Inno Setup compiler was not found."
            }
            & $compilerPath installer/windows/qr-code-generator.iss
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/QR-Code-Generator-Setup.exe

  debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian/Ubuntu package
        run: sh installer/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debian-ubuntu-package
          path: dist/qr-code-generator-app_*.deb
