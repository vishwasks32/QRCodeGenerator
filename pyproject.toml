[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qr-code-generator-app"
version = "0.1.0"
description = "Generate QR codes using a graphical or command-line interface."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["qrcode[pil]"]

[project.optional-dependencies]
installer = ["pyinstaller>=6"]

[project.scripts]
qr-generator = "qr_code_generator.generator:main"
qr-generator-ui = "qr_code_generator.launcher:main"

[tool.setuptools.packages.find]
include = ["qr_code_generator*"]

[tool.setuptools.data-files]
"share/applications" = ["QR Code Generator.desktop"]
"share/pixmaps" = ["qr_code_generator/assets/qr_gen_icon.png"]
